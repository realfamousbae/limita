name: Windows release

# Push a tag like `windows-v0.1.0` to build the installer and publish it with the notes
# in windows/release-notes.md. The tag must match the version in tauri.conf.json.
on:
  push:
    tags: ["windows-v*"]

jobs:
  build:
    uses: ./.github/workflows/windows.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version windows/app/src-tauri/tauri.conf.json)
          if [ "windows-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: limita-windows-installer
          path: installer
      # Not marked latest: /releases/latest keeps pointing at the macOS app.
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Limita for Windows ${GITHUB_REF_NAME#windows-v}" \
            --notes-file windows/release-notes.md \
            --latest=false
