name: Windows installer for a release

# One version for every platform. Pushing a tag like `v0.3.0` builds the Windows
# installer and attaches it to that release, next to the macOS DMG. The release itself,
# with its notes and the DMG, is created by hand; this job waits for it.
on:
  push:
    tags: ["v*"]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches both apps' versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          windows=$(jq -r .version windows/app/src-tauri/tauri.conf.json)
          macos=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' macos/project.yml)
          echo "tag $tag, Windows $windows, macOS $macos"
          [ "$tag" = "$windows" ] && [ "$tag" = "$macos" ]

  build:
    needs: versions
    uses: ./.github/workflows/windows.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: limita-windows-installer
          path: installer
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "Release $GITHUB_REF_NAME not created yet, waiting…"
            sleep 60
          done
          # latest.json is what the in-app updater reads; it points at the installer and
          # carries its signature, which the app checks before running it.
          exe=$(ls installer/*.exe | head -n 1)
          name=$(basename "$exe")
          [ -f "$exe.sig" ] || { echo "No $name.sig: is the TAURI_SIGNING_PRIVATE_KEY secret set?" >&2; exit 1; }
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${name// /.}" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > installer/latest.json
          gh release upload "$GITHUB_REF_NAME" "$exe" installer/latest.json --repo "$GITHUB_REPOSITORY" --clobber
