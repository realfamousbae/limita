name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  # Used by windows-release.yml.
  workflow_call:

defaults:
  run:
    working-directory: windows

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo test -p limita-core -p limita-cli

  app:
    name: Installer
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - run: npm ci
        working-directory: windows/app
      # The app crate needs the frontend and the limita-cli sidecar to exist to compile.
      - run: npm run sidecar && npm run build
        working-directory: windows/app
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p limita
      - run: npm run tauri build
        working-directory: windows/app
      - uses: actions/upload-artifact@v4
        with:
          name: limita-windows-installer
          path: windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error
