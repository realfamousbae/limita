name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", "assets/**", "scripts/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "assets/**", "scripts/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  # Used by windows-release.yml, which passes the updater's signing key.
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

defaults:
  run:
    working-directory: windows

jobs:
  core:
    name: Core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared artwork is in sync
        shell: bash
        run: ../scripts/sync-assets.sh --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo test -p limita-core -p limita-cli

  app:
    name: Installer
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - run: npm ci
        working-directory: windows/app
      # The app crate needs the frontend and the limita-cli sidecar to exist to compile.
      - run: npm run sidecar && npm run build
        working-directory: windows/app
      # Reported, not enforced: a lint added in a newer Rust must not block the installer.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test -p limita
      # With the signing key (pushes and releases here, not forks) the build also signs the installer for the
      # in-app updater, `*.exe.sig`; without it, e.g. on pull requests, it skips that.
      - name: Build the installer
        shell: bash
        working-directory: windows/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: limita-windows-installer
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
